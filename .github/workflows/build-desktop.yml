name: Build Ultrabrasa Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "electron/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vite.electron.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fixar versão estável do npm
        run: npm install --global npm@10.8.2

      - name: Verificar arquivos de configuração
        shell: pwsh
        run: |
          $required = @("package.json", "vite.electron.config.ts", "electron/main.cjs", "electron/preload.cjs", "electron/icon.ico")
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Arquivo obrigatório ausente: $file" }
          }
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json válido')"

      - name: Instalar dependências do projeto (incluindo opcionais)
        run: npm install --no-package-lock --no-audit --no-fund --include=dev --include=optional

      - name: Validar dependência nativa do Lightning CSS
        shell: pwsh
        run: |
          node -e "const p=require('lightningcss'); const r=p.transform({filename:'check.css',code:Buffer.from('body { display: flex; }')}); if (!r.code) process.exit(1); console.log('Lightning CSS carregado e transformação validada')"
          if ($LASTEXITCODE -ne 0) { throw "O Lightning CSS não carregou corretamente no Windows." }

      - name: Gerar versão web
        shell: pwsh
        run: |
          npm run build -- --config vite.electron.config.ts --configLoader runner
          if ($LASTEXITCODE -ne 0) { throw "Build web falhou. Consulte as mensagens de erro acima." }

      - name: Incluir logo local no aplicativo
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const path = require('path');
          const asset = JSON.parse(fs.readFileSync('src/assets/ultraconnect-logo.jpeg.asset.json', 'utf8'));
          async function prepare() {
            const response = await fetch(new URL(asset.url, 'https://ultrabrasa.lovable.app'));
            if (!response.ok || !(response.headers.get('content-type') || '').startsWith('image/')) throw new Error('Não foi possível baixar a logo original.');
            const destination = path.join('dist/client', asset.url);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.writeFileSync(destination, Buffer.from(await response.arrayBuffer()));
          }
          prepare().catch(error => { console.error(error.message); process.exitCode = 1; });
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível incluir a logo local." }

      - name: Verificar arquivos gerados
        shell: pwsh
        run: |
          if (!(Test-Path "dist/client/index.html")) {
            Write-Host "Conteúdo de dist:"
            if (Test-Path "dist") { Get-ChildItem "dist" -Recurse | Select-Object -First 100 FullName }
            throw "Build não gerou dist/client/index.html; o empacotamento foi interrompido."
          }
          if (!(Test-Path "electron/main.cjs")) { throw "Arquivo electron/main.cjs não encontrado." }
          if (!(Test-Path "electron/preload.cjs")) { throw "Arquivo electron/preload.cjs não encontrado." }
          if (!(Test-Path "electron/icon.ico")) { throw "Arquivo electron/icon.ico não encontrado." }

      - name: Empacotar aplicativo Windows x64
        shell: pwsh
        run: |
          $electronVersion = node -p "require('electron/package.json').version"
          npx @electron/packager . Ultrabrasa --platform=win32 --arch=x64 --electron-version=$electronVersion --out="$env:RUNNER_TEMP/ultrabrasa-release" --overwrite --icon=electron/icon.ico --ignore="^/(node_modules|src|public|dist/server|\.git|\.github|android-app)(/|$)" --ignore="^/\.env"
          if ($LASTEXITCODE -ne 0) { throw "Empacotamento do Electron falhou." }

      - name: Verificar aplicativo empacotado
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/ultrabrasa-release/Ultrabrasa-win32-x64"
          if (!(Test-Path "$app/Ultrabrasa.exe")) { throw "Executável Ultrabrasa.exe não foi gerado." }
          if (!(Test-Path "$app/resources/app/electron/main.cjs")) { throw "Código principal do Electron não foi incluído no pacote." }
          if (!(Test-Path "$app/resources/app/dist/client/index.html")) { throw "Arquivos web não foram incluídos no pacote." }

      - name: Criar ZIP portátil
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/ultrabrasa-release/Ultrabrasa-win32-x64"
          Compress-Archive -Path "$app/*" -DestinationPath "Ultrabrasa-Desktop-Windows-x64.zip" -Force
          if (!(Test-Path "Ultrabrasa-Desktop-Windows-x64.zip")) { throw "ZIP portátil não foi criado." }

      - name: Disponibilizar arquivo para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Ultrabrasa-Desktop-Windows-x64
          path: Ultrabrasa-Desktop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
